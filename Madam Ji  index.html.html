<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Little Question ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      overflow: hidden; font-family: "Quicksand", "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #ffe4ef, #f7b7d0 55%, #ed91b6);
      color: #7b1745;
    }
    .hearts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .heart {
      position: absolute; bottom: -40px; color: rgba(255,255,255,.7);
      font-size: 22px; animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      to { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
    }
    .card {
      width: min(90vw, 440px); min-height: 330px; padding: 42px 24px;
      border: 1px solid rgba(255,255,255,.75); border-radius: 28px;
      background: rgba(255,255,255,.82); box-shadow: 0 18px 55px rgba(126,25,72,.18);
      text-align: center; position: relative; z-index: 1;
      backdrop-filter: blur(10px);
    }
    .emoji { font-size: 48px; margin-bottom: 12px; }
    h1 { font-family: "Dancing Script", "Brush Script MT", cursive; font-size: clamp(38px, 9vw, 52px); font-weight: 700; margin: 8px 0 12px; color: #b51f61; line-height: 1.2; }
    p { font-size: 17px; color: #9b4169; }
    .buttons {
      display: flex; justify-content: center; align-items: center;
      gap: 18px; margin: 34px auto 0; min-height: 58px; position: relative;
    }
    button {
      border: 0; border-radius: 999px; padding: 14px 30px;
      font-size: 17px; font-weight: 700; cursor: pointer;
      box-shadow: 0 7px 16px rgba(130,20,70,.16);
      transition: transform .15s ease, background .15s ease;
    }
    #yesBtn { background: #e83e83; color: white; }
    #yesBtn:hover { background: #cc286d; transform: scale(1.06); }
    #noBtn { background: #f3dce7; color: #9a4268; }
    .hidden { display: none; }
    #message h1 { font-size: clamp(36px, 8vw, 48px); line-height: 1.2; }
    #message .big-heart { font-size: 64px; animation: beat 1s infinite; }
    @keyframes beat { 50% { transform: scale(1.18); } }
    .sparkle { font-size: 25px; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="hearts" id="hearts"></div>

  <main class="card" id="question">
    <div class="emoji">🥰</div>
    <h1>You Love Me?</h1>
    <p>Think carefully... ❤️</p>
    <div class="buttons" id="buttonArea">
      <button id="yesBtn">YES 💗</button>
      <button id="noBtn" type="button">NO 🙈</button>
    </div>
  </main>

  <main class="card hidden" id="message">
    <div class="big-heart">❤️</div>
    <h1>I Know You Love Me</h1>
    <h1>&amp; I Love You Too Harshita 💕</h1>
    <p>Forever &amp; Always 🥰</p>
    <div class="sparkle">✨ 💖 ✨</div>
  </main>

  <script>
    const question = document.getElementById("question");
    const message = document.getElementById("message");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const buttonArea = document.getElementById("buttonArea");

    yesBtn.addEventListener("click", () => {
      question.classList.add("hidden");
      message.classList.remove("hidden");
      document.title = "I Love You Harshita ❤️";
    });

    // The NO button playfully runs away and never accepts a click.
    function moveNoButton() {
      const area = buttonArea.getBoundingClientRect();
      const btn = noBtn.getBoundingClientRect();
      const maxX = Math.max(0, area.width - btn.width);
      const maxY = 75;
      noBtn.style.position = "relative";
      noBtn.style.left = (Math.random() * maxX - maxX / 2) + "px";
      noBtn.style.top = (Math.random() * maxY - maxY / 2) + "px";
    }
    noBtn.addEventListener("pointerenter", moveNoButton);
    noBtn.addEventListener("touchstart", (event) => {
      event.preventDefault();
      moveNoButton();
    }, { passive: false });
    noBtn.addEventListener("click", (event) => {
      event.preventDefault();
      moveNoButton();
    });

    // Floating hearts in the background.
    const hearts = document.getElementById("hearts");
    const symbols = ["❤", "💕", "♡", "💗"];
    for (let i = 0; i < 22; i++) {
      const heart = document.createElement("span");
      heart.className = "heart";
      heart.textContent = symbols[i % symbols.length];
      heart.style.left = Math.random() * 100 + "%";
      heart.style.animationDuration = (7 + Math.random() * 9) + "s";
      heart.style.animationDelay = (-Math.random() * 12) + "s";
      heart.style.fontSize = (16 + Math.random() * 20) + "px";
      hearts.appendChild(heart);
    }
  </script>
</body>
</html>

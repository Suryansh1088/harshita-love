<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Little Love For You ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; overflow: hidden;
      font-family: 'Poppins', sans-serif; color: #fff;
      background: radial-gradient(circle at 20% 20%, #ffb6c9 0, transparent 30%),
                  radial-gradient(circle at 80% 80%, #b58bff 0, transparent 32%),
                  linear-gradient(135deg, #260b35, #6d174d 55%, #251044);
    }
    .hearts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .heart { position: absolute; bottom: -50px; color: #ffc4dc; opacity: .5; animation: float 10s linear infinite; }
    @keyframes float { to { transform: translateY(-115vh) rotate(360deg); opacity: 0; } }
    .card {
      width: min(90vw, 560px); min-height: 360px; padding: 48px 28px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; position: relative; z-index: 1;
      border: 1px solid rgba(255,255,255,.28); border-radius: 30px;
      background: rgba(255,255,255,.13); backdrop-filter: blur(16px);
      box-shadow: 0 25px 80px rgba(0,0,0,.28);
    }
    .emoji { font-size: 42px; margin-bottom: 12px; filter: drop-shadow(0 5px 12px #ff5d9e); }
    h1 { font-family: 'Dancing Script', cursive; font-size: clamp(2.7rem, 8vw, 4.4rem); line-height: 1.08; margin: 0 0 14px; }
    p { color: #ffe5f0; font-size: 1rem; margin: 0 0 30px; }
    .buttons { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; width: 100%; }
    button {
      border: 0; border-radius: 999px; padding: 14px 34px; min-width: 130px;
      font: 600 1rem 'Poppins', sans-serif; cursor: pointer; transition: transform .2s, box-shadow .2s;
    }
    button:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0,0,0,.2); }
    .yes, .big { color: #7d174d; background: linear-gradient(135deg, #fff0f6, #ff9ec5); }
    .no, .little { color: #fff; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.45); }
    .no { position: relative; }
    .hidden { display: none; }
    .final h1 { font-size: clamp(2.5rem, 8vw, 4.2rem); }
    .final p { font-size: 1.08rem; line-height: 1.8; }
    .sparkle { font-size: 28px; letter-spacing: 8px; margin-top: 8px; }
    @media (max-width: 420px) {
      .card { padding: 38px 20px; min-height: 340px; }
      button { min-width: 120px; padding: 13px 25px; }
    }
  </style>
</head>
<body>
  <div class="hearts" id="hearts"></div>
  <main class="card" id="page1">
    <div class="emoji">💗</div>
    <h1>You Love Me?</h1>
    <p>Ek chhota sa sawaal hai… dil se jawab dena ❤️</p>
    <div class="buttons">
      <button class="yes" onclick="showPage(2)">Yes 💕</button>
      <button class="no" id="no1">No 🙈</button>
    </div>
  </main>
  <main class="card hidden" id="page2">
    <div class="emoji">🥰</div>
    <h1>Kitna Pyar Hai Mere Se?</h1>
    <p>Soch samajh kar jawab dena, Madm! 💞</p>
    <div class="buttons">
      <button class="little" id="little">Thoda sa</button>
      <button class="big" onclick="showPage(3)">Bahut saara ❤️</button>
    </div>
  </main>
  <main class="card final hidden" id="page3">
    <div class="emoji">💖</div>
    <h1>I know you love me more!</h1>
    <p>And I Love You Too, Madm. ❤️<br>Hamesha aise hi muskurati rehna…<br>You are very special to me! 🌹</p>
    <div class="sparkle">✨ 💗 ✨</div>
  </main>
  <script>
    function showPage(number) {
      document.querySelectorAll('.card').forEach(card => card.classList.add('hidden'));
      document.getElementById('page' + number).classList.remove('hidden');
    }
    function dodge(button) {
      button.addEventListener('mouseenter', move);
      button.addEventListener('click', move);
      button.addEventListener('touchstart', (event) => {
        event.preventDefault();
        move();
      }, { passive: false });
      function move() {
        const x = Math.random() * 180 - 90;
        const y = Math.random() * 100 - 50;
        button.style.transform = `translate(${x}px, ${y}px)`;
      }
    }
    dodge(document.getElementById('no1'));
    dodge(document.getElementById('little'));
    const heartBox = document.getElementById('hearts');
    for (let i = 0; i < 24; i++) {
      const heart = document.createElement('span');
      heart.className = 'heart';
      heart.textContent = ['♡', '♥', '💕'][i % 3];
      heart.style.left = Math.random() * 100 + '%';
      heart.style.fontSize = (16 + Math.random() * 24) + 'px';
      heart.style.animationDuration = (7 + Math.random() * 9) + 's';
      heart.style.animationDelay = (Math.random() * 8) + 's';
      heartBox.appendChild(heart);
    }
  </script>
</body>
</html>
